<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Page not found</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/comic.css">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--canvas); padding: 16px; }
    .lost { position: relative; max-width: 520px; width: 100%; background: var(--yellow); border: 4px solid var(--ink); box-shadow: 10px 10px 0 var(--mint); padding: 28px 22px; text-align: center; }
    .lost .burst { width: 180px; margin: -70px auto 10px; }
    .lost .burst span { font-size: 46px; }
    .lost p { font: 700 14px/1.5 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; }
    .lost a { display: inline-block; margin-top: 8px; background: var(--ink); color: var(--yellow); padding: 14px 18px; font: 700 13px/1 var(--font-mono); text-decoration: none; text-transform: uppercase; }
  </style>
</head>
<body>
  <main class="lost halftone">
    <div class="burst"><span>404!</span></div>
    <p>This panel got lost in the gutter.</p>
    <a href="/">Back to the latest issue</a>
  </main>
</body>
</html>
